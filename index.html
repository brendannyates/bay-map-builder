<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bay Map Builder</title>
<!-- Copied from ESK Tracker (src/taskpane.html) so the builder and its Preview look exactly like the tracker. Keep in step. -->
<style id="tok">
/* ===== foundation: fonts ===== */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
/* ===== foundation: tokens (old variable names kept) ===== */
:root{
  color-scheme:light;
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#E9EBE6;--surface3:#F7F8F5;
  --ink:#1B211F;--muted:#616B66;--faint:#A3ABA6;--line:#E2E5DF;
  --accent:#1E6B59;--accent-ink:#FFFFFF;--accent-soft:#DDEDE6;
  --ok:#1E6B59;--ok-soft:#DDEDE6;--warn:#8F5400;--warn-soft:#FAE9CF;
  --bad:#B3261E;--bad-ink:#FFFFFF;--bad-soft:#F9DCD9;--info:#3D5E78;--info-soft:#E3EAF0;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,20,.05),0 12px 32px -14px rgba(16,24,20,.14);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  --scrim:rgba(16,24,20,.30);--wash:rgba(243,244,241,.6);
  --s1:#2a78d6;--s2:#eb6834;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#131716;--surface:#1B2220;--surface2:#252D2A;--surface3:#182019;--ink:#ECEFED;--muted:#9BA59F;--faint:#5C6763;--line:#2C3532;
  --accent:#6DC4A6;--accent-ink:#0E2A22;--accent-soft:#1D3A31;--ok:#6DC4A6;--ok-soft:#1D3A31;--warn:#E9B150;--warn-soft:#3A2D13;
  --bad:#F19189;--bad-ink:#3A0F0C;--bad-soft:#43211E;--info:#9DBAD3;--info-soft:#1F2B35;
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 32px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.45);--wash:rgba(19,23,22,.6);
  --s1:#3987e5;--s2:#d95926;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131716;--surface:#1B2220;--surface2:#252D2A;--surface3:#182019;--ink:#ECEFED;--muted:#9BA59F;--faint:#5C6763;--line:#2C3532;
  --accent:#6DC4A6;--accent-ink:#0E2A22;--accent-soft:#1D3A31;--ok:#6DC4A6;--ok-soft:#1D3A31;--warn:#E9B150;--warn-soft:#3A2D13;
  --bad:#F19189;--bad-ink:#3A0F0C;--bad-soft:#43211E;--info:#9DBAD3;--info-soft:#1F2B35;
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 32px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.45);--wash:rgba(19,23,22,.6);
  --s1:#3987e5;--s2:#d95926;}
</style>
<style id="base">
/* ===== foundation: base ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
h2{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
h3{margin:14px 0 8px;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
h3:first-child{margin-top:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .faint{color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
</style>
<style id="ctl">
/* ===== foundation: buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--surface2);color:var(--ink);font-weight:500;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background .2s ease,opacity .2s ease}
.btn:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent),var(--ink) 14%)}
.btn.primary.late,.btn.bad{background:var(--bad);color:var(--bad-ink)}
.btn.primary.late:hover,.btn.bad:hover{background:color-mix(in srgb,var(--bad),var(--ink) 14%)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 12px}
.btn.ghost:hover{background:var(--surface2)}
.btn.ghost.mute{color:var(--muted)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn.inline{min-height:0;padding:0;background:none;color:inherit;border-radius:4px;text-decoration:underline dotted;text-underline-offset:3px}
.btn.inline:hover{background:none;color:var(--accent)}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface2)} .btn.primary:disabled:hover{background:var(--accent)} .btn.ghost:disabled:hover{background:transparent}
@media (max-width:899px){.btn{min-height:40px;padding:0 14px}.btn.sm{min-height:34px;padding:0 10px}.btn.lg{min-height:48px;padding:0 20px}.btn.ghost{padding:0 10px}.btn.inline{min-height:0;padding:0}}
.linkbtn{display:inline-flex;align-items:center;min-height:32px;background:none;border:0;color:var(--accent);font-weight:500;cursor:pointer;padding:4px 2px;font-size:14px;border-radius:6px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
/* ===== foundation: fields ===== */
input.fld,select.fld,textarea.fld{width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:var(--bg);color:var(--ink)}
textarea.fld{line-height:1.45}
input.fld::placeholder,textarea.fld::placeholder{color:var(--muted)}
input.fld:focus,select.fld:focus,textarea.fld:focus{outline:2px solid var(--accent);outline-offset:0}
.card input.fld:not(.search),.card select.fld,.card textarea.fld,.sheet input.fld,.sheet select.fld,.sheet textarea.fld{background:var(--bg)}
.ro{background:var(--surface2)!important;color:var(--muted)}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:400}
label.lbl:first-child{margin-top:0}
.check{display:flex;align-items:center;gap:14px;min-height:50px;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.check .l{flex:1;min-width:0} .check .l small{display:block;color:var(--muted);font-size:13px}
.check+.check{border-top:1px solid var(--line)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}

/* ===== foundation: segmented controls ===== */
.seg{display:inline-flex;gap:6px;flex-wrap:wrap;border:0;background:transparent}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.seg button:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* ===== foundation: messages, stats, tiles ===== */
.msg{border:0;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.msg.fresh{display:block}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.info{background:var(--info-soft);color:var(--info)}
.msg b{color:inherit}
</style>
<style id="eskMap">
/* ===== foundation: cards and flat sections ===== */
.card{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin:0 0 16px}
.card h2{margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
.card h2 .sp{flex:1}
.card .card{background:var(--surface3);box-shadow:none;border-radius:12px;padding:14px 16px}
@media (max-width:899px){.card{padding:14px;border-radius:14px;margin-bottom:12px}}
/* bay map: collapsible floor plan of the two treatment rooms (CFG.bayMap keeps it open or closed per user) */
.pg-today .bmap{padding:4px 18px;margin-bottom:18px}
.pg-today .bmap>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.pg-today .bmap>summary::-webkit-details-marker{display:none}
.pg-today .bmap>summary::after{content:"▸";color:var(--faint);font-weight:400}
.pg-today .bmap[open]>summary::after{content:"▾"}
.pg-today .bmap>summary .muted{font-weight:400;font-size:13px}
.pg-today .bmap[open]{padding-bottom:14px}
.bplan{position:relative;aspect-ratio:808/392;container-type:inline-size;margin-top:4px}
.bplan svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.bplan .wall{stroke:var(--ink);stroke-width:8;fill:none;stroke-linecap:square}
.bplan .wall.thin{stroke-width:4.5}
.bplan .window .wf{stroke:var(--ink);stroke-width:8;fill:none}
.bplan .window .wg{stroke:var(--surface);stroke-width:4;fill:none}
.bplan{--lamp:#FFD38A;--lamp-edge:#C98A2B;--glow:#FFC56B;--glow-a:.75}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bplan{--lamp-edge:#E9B150;--glow:#FFB547;--glow-a:.6}}
:root[data-theme="dark"] .bplan{--lamp-edge:#E9B150;--glow:#FFB547;--glow-a:.6}
.bplan .curtain path{fill:none;stroke-linejoin:round}
.bplan .curtain .crail{stroke:var(--faint);stroke-width:1.25;stroke-dasharray:3 3}
.bplan .curtain .fabric{stroke:var(--muted);stroke-width:5.5;stroke-linecap:round;stroke-dasharray:0 7}
.bplan .curtain .bunch{stroke:var(--muted);stroke-width:11;stroke-linecap:butt;stroke-dasharray:1.4 1.4 1.4 1.4 1.4 1.4 1.4 1.4 1.4 1.4 0 86}
.bplan .lantern .body{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.bplan .lantern .lens{fill:var(--surface2)}
.bplan .lantern .touch{fill:var(--muted)}
.bplan .lantern.on .body{stroke:var(--lamp-edge)}
.bplan .lantern.on .lens{fill:var(--lamp)}
.bplan .lantern.on .touch{fill:var(--lamp-edge)}
.bplan .door{stroke:var(--faint);stroke-width:1.75;fill:none}
.bplan .table{fill:var(--surface3);stroke:var(--faint);stroke-width:1.75}
.bplan .seat{fill:var(--surface);stroke:var(--muted);stroke-width:1.75}
.bplan .back,.bplan .arm{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.bplan .room{position:absolute;transform:translate(-50%,-50%);font-size:clamp(10px,1.6cqw,12.5px);font-weight:600;color:var(--muted);white-space:nowrap}
.bplan .room.small{font-weight:500;font-size:clamp(9px,1.3cqw,11px)}
.bplan .bay{position:absolute;aspect-ratio:1;border-radius:50%;--rw:2px;--rc:var(--surface2);background:var(--surface3);box-shadow:inset 0 0 0 var(--rw) var(--rc);transition:box-shadow .2s,background .2s,filter .2s}
.bplan .bay[data-state="open"]{background:transparent;box-shadow:none;border:2px dashed var(--faint)}
.bplan .bay[data-state="track"]{background:var(--surface2);--rc:var(--faint);--rw:2.5px}
.bplan .bay[data-state="soon"]{background:var(--warn-soft);--rc:var(--warn);--rw:3px}
.bplan .bay[data-state="late"]{background:var(--bad-soft);--rc:var(--bad);--rw:3.5px}
.bplan .bay[data-state="ready"]{background:var(--accent-soft);--rc:var(--accent);--rw:3px}
.bplan .bay:hover{filter:brightness(.96)}
.bplan .bay[aria-current="true"]{box-shadow:inset 0 0 0 var(--rw) var(--rc),0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.bplan .bay[data-state="open"][aria-current="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
/* Dark: the tags sit on the same surface as the card, so they get a lighter fill and an outline in the bay's state colour */
.bplan{--tag-bg:var(--surface);--tag-line:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bplan{--tag-bg:#2C3632;--tag-line:rgba(255,255,255,.18)}
  :root:not([data-theme="light"]) .bplan .btag[data-state="soon"]{--tag-line:var(--warn)}:root:not([data-theme="light"]) .bplan .btag[data-state="late"]{--tag-line:var(--bad)}:root:not([data-theme="light"]) .bplan .btag[data-state="ready"]{--tag-line:var(--accent)}
  :root:not([data-theme="light"]) .bplan .bay[data-state="track"]{--rc:var(--muted)}:root:not([data-theme="light"]) .bplan .bay[data-state="busy"]{--rc:var(--muted)}}
:root[data-theme="dark"] .bplan{--tag-bg:#2C3632;--tag-line:rgba(255,255,255,.18)}
:root[data-theme="dark"] .bplan .btag[data-state="soon"]{--tag-line:var(--warn)}:root[data-theme="dark"] .bplan .btag[data-state="late"]{--tag-line:var(--bad)}:root[data-theme="dark"] .bplan .btag[data-state="ready"]{--tag-line:var(--accent)}
:root[data-theme="dark"] .bplan .bay[data-state="track"]{--rc:var(--muted)}:root[data-theme="dark"] .bplan .bay[data-state="busy"]{--rc:var(--muted)}
.bplan .btag{position:absolute;transform:translate(-50%,-50%);pointer-events:none;background:var(--tag-bg);border-radius:clamp(6px,1.4cqw,11px);padding:clamp(2px,.8cqw,7px) clamp(5px,1.4cqw,11px);box-shadow:0 0 0 1.5px var(--tag-line),0 1px 2px rgba(16,24,20,.08),0 8px 18px -10px rgba(16,24,20,.35);white-space:nowrap;line-height:1.2;max-width:28cqw}
.bplan .btag .n{font-weight:600;font-size:clamp(10px,2cqw,14px);overflow:hidden;text-overflow:ellipsis}
.bplan .btag .num{color:var(--muted);margin-right:.4em}
.bplan .btag .s{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:clamp(9px,1.75cqw,12.5px);color:var(--muted);overflow:hidden}
.bplan .btag .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.bplan .btag[data-state="track"] .dot{background:var(--muted)}
.bplan .btag[data-state="ready"] .dot{background:var(--accent)} .bplan .btag[data-state="ready"] .s{color:var(--accent);font-weight:600}
.bplan .btag[data-state="soon"] .dot{background:var(--warn)} .bplan .btag[data-state="soon"] .s{color:var(--warn);font-weight:600}
.bplan .btag[data-state="late"] .dot{background:var(--bad)} .bplan .btag[data-state="late"] .s{color:var(--bad);font-weight:600}
.bplan .btag[data-state="open"] .n{color:var(--muted)}
.bplan .btag .tx{overflow:hidden;text-overflow:ellipsis}
@container (max-width:560px){.bplan .btag .tx{display:none}.bplan .btag .s{margin-top:1px}}
.pg-today .bmap{container:bmap / inline-size}
.bwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);grid-template-areas:"map panel" "next panel";gap:0 18px;align-items:start}
.bwrap>.bleft{grid-area:map}.bwrap>.bpanel{grid-area:panel}.bwrap>.bnext{grid-area:next}
@container bmap (max-width:820px){.bwrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "panel" "next"}.bwrap>.bpanel{margin-top:14px}}
.bpanel{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.bpanel .bph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bpanel .name{font-weight:600;font-size:18px}
.bpanel .bayno{margin-left:8px;font-weight:400;font-size:13px;color:var(--muted)}
.bpanel .meta,.bpanel .body{color:var(--muted);margin:0}
.bpanel .lead{margin:0}
.bpanel .row{display:flex;gap:6px;flex-wrap:wrap}
.bkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.bkey li{display:flex;align-items:center;gap:7px}
.bkey .bsw{flex:none;width:14px;height:14px;border-radius:50%;background:var(--surface3);box-shadow:inset 0 0 0 2px var(--surface2)}
.bkey .bsw[data-k="open"]{background:transparent;box-shadow:none;border:1.5px dashed var(--faint)}
.bkey .bsw[data-k="track"]{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--faint)}
.bkey .bsw[data-k="soon"]{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
.bkey .bsw[data-k="late"]{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.bkey .bsw[data-k="ready"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.bplan .bay[data-state="busy"]{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,transparent 6px 12px);--rc:var(--faint)}
.bplan .btag[data-state="busy"] .n{color:var(--muted)}
.bkey .bsw[data-k="busy"]{background:repeating-linear-gradient(45deg,var(--surface2) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 2px var(--faint)}
.bpanel .pvits{display:grid;gap:6px}
.bpanel .pvit{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.bpanel .pvit .pl{font-weight:600;font-size:13px}
.bpanel .lead.ready{color:var(--accent)}.bpanel .lead.late{color:var(--bad)}.bpanel .lead.soon{color:var(--warn)}
.bmap .boff{margin:10px 0 0;font-size:13px;color:var(--muted)}
.bmap .boff .btn.inline{color:var(--warn)}
</style>
<style>
/* ===== builder: shell ===== */
:root{--railw:164px;--inspw:320px}
@media (max-width:1279px){:root{--railw:150px;--inspw:296px}}
html,body{height:100%;overflow:hidden}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;min-width:1000px}
.top{display:flex;align-items:center;gap:6px;padding:10px 16px;min-width:0}
.mark{flex:none;width:40px;height:40px;margin-right:6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark .ic{width:24px;height:24px;stroke-width:1.9}
@media (max-width:1179px){.mark{display:none}}
.ttl{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:0 1 auto;margin-right:12px}
.nmrow{display:flex;align-items:center;gap:8px;min-width:0}
input.nm,input.cl{border:0;border-radius:8px;background:transparent;min-width:0;text-overflow:ellipsis}
input.nm{field-sizing:content;width:220px;min-width:120px;max-width:340px;height:32px;padding:0 8px;margin-left:-8px;font-size:17px;font-weight:600;letter-spacing:-.01em}
input.cl{field-sizing:content;width:90px;min-width:64px;max-width:130px;height:28px;padding:0 9px;font-size:13px;color:var(--muted);background:var(--surface2)}
input.nm:hover{background:var(--surface2)}
input.nm:focus,input.cl:focus{background:var(--surface);outline:2px solid var(--accent);outline-offset:0}
input.nm::placeholder,input.cl::placeholder{color:var(--muted);font-weight:400}
.status{display:flex;align-items:center;gap:7px;min-height:18px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.status.pend i{background:var(--faint)} .status.fail{color:var(--bad)} .status.fail i{background:var(--bad)} .status.dirty i{background:var(--warn)}
.tabs{flex:none;display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:var(--surface2)}
.tabs button{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 18px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;line-height:1;display:inline-grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
.tabs .cnt.bad{background:var(--bad);color:var(--bad-ink)}
.top .sp{flex:1 1 0;min-width:4px}
.ib{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--surface2)} .ib:disabled{opacity:.32;cursor:default} .ib:disabled:hover{background:transparent}
.top .btn{flex:none;white-space:nowrap} .top .btn .ic{width:18px;height:18px}
.top .vsep{flex:none;width:1px;height:24px;margin:0 6px;background:var(--line)}
.work{display:grid;grid-template-columns:var(--railw) minmax(0,1fr) var(--inspw);gap:12px;padding:0 16px 16px;min-height:0}
.work.pvmode{grid-template-columns:320px minmax(0,1fr)}
.work.pvmode>.rail,.work.pvmode>.stage,.work.pvmode>.insp{display:none}
kbd{font:500 11.5px/1 var(--font);color:var(--muted);padding:4px 6px;border-radius:6px;background:var(--surface2);white-space:nowrap}

/* ===== builder: tool rail ===== */
.rail{display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;padding:4px;margin:-2px;scrollbar-width:thin}
.tool{flex:none;display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 8px 0 11px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tool:hover{background:var(--surface2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tool[aria-pressed="true"] .ic{color:var(--accent)}
.tool span{overflow:hidden;text-overflow:ellipsis}
.tool kbd{margin-left:auto;color:var(--faint);background:transparent;padding:4px 2px}
.tool.hl{box-shadow:0 0 0 2px var(--accent);color:var(--ink)}
.rail hr{flex:none;width:calc(100% - 20px);height:1px;margin:6px 10px;border:0;background:var(--line)}

/* ===== builder: canvas ===== */
.stage{position:relative;min-width:0;min-height:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stage:has(#cv:focus-visible){box-shadow:var(--shadow),0 0 0 2px var(--accent)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.stage[data-cur="draw"] #cv{cursor:crosshair} .stage[data-cur="grab"] #cv{cursor:grab} .stage[data-cur="grabbing"] #cv{cursor:grabbing}
.stage[data-cur="move"] #cv{cursor:move} .stage[data-cur="no"] #cv{cursor:not-allowed}
.gmin{stroke:var(--line);stroke-width:1;fill:none;opacity:.5}
.gmaj{stroke:var(--line);stroke-width:1;fill:none}
/* drawn layer: the tracker's own .bplan styles, plus rugs, room names and tags drawn in SVG */
#draw .rug{fill:var(--surface3);stroke:var(--faint);stroke-width:2;stroke-dasharray:6 5}
#draw .rlab{font-size:13px;font-weight:600;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
#draw .rlab.small{font-size:11px;font-weight:500}
#draw .etag rect{fill:var(--surface);stroke:color-mix(in srgb,var(--line),var(--ink) 12%);stroke-width:1.2}
#draw .etag text{font-weight:600;fill:var(--muted)} #draw .etag .s{font-weight:400;fill:var(--faint)}
:root[data-theme="dark"] #draw .etag rect{fill:#2C3632}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #draw .etag rect{fill:#2C3632}}
/* editing layer: outlines, handles, guides, the line being drawn, what a click would add */
#hud *{vector-effect:non-scaling-stroke}
#hud .ol{fill:none;stroke:var(--accent);stroke-width:2}
#hud .ol.hov{stroke-width:1.5;opacity:.45}
#hud .ol.tagol{stroke-dasharray:4 3}
#hud .stem{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
#hud .hv{fill:var(--surface);stroke:var(--accent);stroke-width:2}
#hud .hv.on{fill:var(--accent)}
#hud .hb{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
#hud .hr{fill:var(--accent);stroke:var(--surface);stroke-width:2}
#hud .hs{fill:var(--surface);stroke:var(--accent);stroke-width:2}
#hud .hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
#hud .hit.v,#hud .hit.tm{cursor:move} #hud .hit.b,#hud .hit.r{cursor:grab} #hud .hit.s{cursor:nwse-resize}
#hud .bunch{fill:var(--accent)}
#hud .guide{fill:none;stroke:var(--info);stroke-width:1;stroke-dasharray:5 4;opacity:.8}
#hud .gpt{fill:none;stroke:var(--info);stroke-width:2}
#hud .gline{fill:none;stroke:var(--info);stroke-width:4;opacity:.35;stroke-linecap:round}
#hud .dwall{fill:none;stroke:var(--ink);stroke-width:8;opacity:.25;stroke-linecap:square;stroke-linejoin:miter;vector-effect:none}
#hud .dcurt{fill:none;stroke:var(--muted);stroke-width:5.5;stroke-linecap:round;stroke-dasharray:0 7;vector-effect:none}
#hud .draft{fill:none;stroke:var(--accent);stroke-width:1.5}
#hud .dpt{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
#hud .dpt.first{fill:var(--accent-soft);stroke-width:2.5}
#hud .dim{font-weight:600;fill:var(--ink);stroke:var(--surface);stroke-width:4;paint-order:stroke;text-anchor:middle;dominant-baseline:central;stroke-linejoin:round}
#hud .ghost{opacity:.75}
#hud .ghost .rug{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;vector-effect:none;opacity:.8}
#hud .ghost .seat,#hud .ghost .back,#hud .ghost .arm{stroke:var(--accent)}
#hud .ghost .table{stroke:var(--accent)}
#hud .ghost .gtag{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
#hud .gap{stroke:var(--surface);stroke-width:12;vector-effect:none}
#hud .dsym{fill:none;stroke:var(--accent);stroke-width:2}
#hud .gwin{stroke:var(--accent);stroke-width:4;vector-effect:none}
#hud .gfurn{fill:var(--surface3);stroke:var(--accent);stroke-width:1.75}
#hud .glab{fill:var(--accent);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
#hud .mq{fill:color-mix(in srgb,var(--accent) 8%,transparent);stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
#hud .scl{stroke:var(--bad);stroke-width:2;fill:none} #hud .sclp{fill:var(--bad)}
:root[data-theme="dark"] #traceL image{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #traceL image{filter:invert(1) hue-rotate(180deg)}}
#hud .tframe{fill:none;stroke:var(--info);stroke-width:1.5;stroke-dasharray:6 4}
.hint{position:absolute;left:14px;bottom:14px;max-width:min(560px,calc(100% - 240px));margin:0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--surface2) 92%,transparent);color:var(--ink);font-size:13.5px;line-height:1.4;pointer-events:none}
.hint:empty{display:none}
.hint b{font-weight:600}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 8px 24px -12px rgba(16,24,20,.3)}
.zoom output{min-width:50px;text-align:center;font-size:13px;color:var(--muted)}
.empty{position:absolute;inset:0;display:grid;place-items:start center;padding:clamp(72px,14vh,150px) 24px 24px;pointer-events:none}
.empty>div{pointer-events:auto;max-width:440px;padding:28px 30px;border-radius:16px;text-align:center;background:color-mix(in srgb,var(--surface) 90%,transparent)}
.empty h2{margin:0 0 8px;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .row{justify-content:center;gap:10px}
.empty .small{margin:16px 0 0}
.coach:not([hidden])~.hint,.stage:has(.coach:not([hidden])) .hint{display:none}
.coach{position:absolute;left:14px;bottom:14px;width:min(360px,calc(100% - 238px));min-width:270px;padding:16px 18px 14px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 18px 40px -16px rgba(16,24,20,.35)}
.coach .steps{display:flex;gap:6px;margin-bottom:12px} .coach .steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)} .coach .steps i.on{background:var(--accent)}
.coach .k{margin:0;font-size:12.5px;color:var(--muted)}
.coach h3{margin:2px 0 6px;font-size:17px}
.coach p{margin:0 0 12px;font-size:14px;line-height:1.45}
.coach .row{gap:6px}
#tip{position:fixed;z-index:15;max-width:300px;padding:7px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;pointer-events:none}

/* ===== builder: inspector ===== */
.insp{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding:2px 2px 8px;scrollbar-width:thin}
.panel{flex:none;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.ph{display:flex;align-items:center;gap:8px;margin:-6px -6px 6px 0}
.panel h2{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.panel h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.panel .sub{margin:0 0 4px;font-size:13.5px;color:var(--muted)}
.panel .msg{margin:6px 0}
.panel>.lbl,.panel .lbl{display:block;margin:16px 0 6px;font-size:13px;color:var(--muted)}
.help{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--muted)}
.help.bad{color:var(--bad)}
.insp .seg{display:flex;flex-wrap:nowrap;gap:4px;width:100%}
.insp .seg button{flex:1 1 0;min-width:0;min-height:44px;padding:0 6px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{min-height:36px;padding:0 12px;border:0;border-radius:18px;background:var(--surface2);font-size:13.5px;cursor:pointer}
.chips button:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.acts .del{color:var(--bad)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.pin{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;border-top:1px solid var(--line);font-size:14px}
.pins{margin-top:14px}
.pin span{color:var(--muted)} .pin span b{font-weight:500;color:var(--ink)} .pin .linkbtn{white-space:nowrap;flex:none}
.check{min-height:46px;gap:12px}
.check .l{font-size:14.5px}
.bays{border:0;padding:0;margin:8px 0 0}
.bays legend{padding:0}
.bays .check{min-height:40px}
.dialrow{display:flex;gap:16px;align-items:center}
.dial{flex:none;width:96px;height:96px;border-radius:50%;cursor:grab;touch-action:none}
.dial:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dial svg{width:100%;height:100%;display:block}
.dial .ring{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.dial .tick{stroke:var(--faint);stroke-width:1.5}
.dial .dch rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.dial .dch .bk{fill:var(--surface2)}
.dial .knob{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.dial .ray{stroke:var(--accent);stroke-width:2;stroke-dasharray:2 3}
.dialv{font-weight:500;margin-bottom:6px}
.dialrow .row{gap:6px}
.dialrow .btn.sm{min-width:44px;min-height:40px;padding:0 10px}
.issues{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.iss{display:flex;gap:10px;align-items:flex-start;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:var(--bg);font-size:13.5px;line-height:1.4;text-align:left;cursor:pointer}
.iss:hover{background:var(--surface2)}
.iss .ic{width:18px;height:18px;margin-top:1px}
.iss.error .ic{color:var(--bad)} .iss.warn .ic{color:var(--warn)} .iss.tip .ic{color:var(--info)}
.iss.nolink{cursor:default}
.ready{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok)}
.ready .ic{width:22px;height:22px;stroke-width:2.2;margin-top:1px}
.ready b{font-weight:600} .ready p{margin:2px 0 0;color:var(--ink);font-size:13.5px}
.clsum{font-size:13px;color:var(--muted);font-weight:400}
.everything>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:28px;font-weight:600;font-size:15px}
.everything>summary::-webkit-details-marker{display:none}
.everything>summary::after{content:"▸";color:var(--faint);font-weight:400;margin-left:auto}
.everything[open]>summary::after{content:"▾"}
.everything ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.everything li button{width:100%;min-height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;cursor:pointer}
.everything li button:hover{background:var(--surface2)}
.everything li button[aria-current="true"]{background:var(--accent-soft)}
.note{margin:0;font-size:13.5px}
.range{width:100%;accent-color:var(--accent);min-height:32px}

/* ===== builder: preview ===== */
.pv{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;gap:12px;min-height:0}
.pvside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding:2px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:56px;padding:9px 14px;border:0;border-radius:12px;background:var(--bg);text-align:left;cursor:pointer}
.opts button:hover{background:var(--surface2)}
.opts button span{font-size:13px;color:var(--muted)}
.opts button[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.pvstage{min-width:0;min-height:0;overflow:auto;border-radius:16px;background:color-mix(in srgb,var(--bg),var(--ink) 4%);padding:28px 24px;display:flex;flex-direction:column;align-items:center}
.pvcap{align-self:stretch;display:flex;justify-content:space-between;gap:12px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.pvsize{flex:none;overflow:hidden}
.pvbox{transform-origin:0 0}
#pvFrame{display:block;border:0;border-radius:14px;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 24px 50px -24px rgba(16,24,20,.35)}
.pvbad{max-width:460px;margin:40px auto}

/* ===== builder: overlays ===== */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#modal .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 26px;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
#modal .sheet.wide{max-width:920px}
.sheet h2{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sheet p{margin:0 0 10px}
.sheet .row.end{justify-content:flex-end;margin-top:18px}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.tpl{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:14px;border:0;border-radius:14px;background:var(--bg);text-align:left;cursor:pointer}
.tpl:hover{background:var(--surface2)}
.tpl .thumb{display:grid;place-items:center;height:150px;margin-bottom:8px;padding:8px;border-radius:10px;background:var(--surface);overflow:hidden}
.tpl .thumb .bplan{margin:0}
.tpl .thumb .blank{color:var(--faint);font-size:14px}
.tpl b{font-weight:600}
.tpl span{font-size:13.5px;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px;margin-top:14px}
.keys h3{grid-column:1 / -1;margin:14px 0 4px;font-size:15px}
.keys h3:first-child{margin-top:0}
.keys div{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:30px;font-size:14px;border-bottom:1px solid var(--line)}
.keys kbd+kbd{margin-left:4px}
.menu{position:fixed;z-index:22;min-width:240px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 18px 40px -14px rgba(16,24,20,.35)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-size:14.5px;text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--surface2);outline:none}
.menu button .ic{color:var(--muted)}
.menu .mk{width:18px;flex:none;color:var(--accent);font-weight:600}
.menu hr{margin:6px 8px;border:0;height:1px;background:var(--line)}
.menu .mh{padding:8px 12px 4px;font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;width:calc(100% - 24px);max-width:540px;pointer-events:none}
#toast .msg{margin:0;width:100%;pointer-events:none;box-shadow:var(--shadow),0 4px 16px rgba(0,0,0,.12)}
#busy{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;background:var(--wash);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v7M12 16v4"/><circle cx="7.5" cy="9" r="2"/><circle cx="16.5" cy="15" r="2"/></svg></div>
    <div class="ttl">
      <div class="nmrow">
        <input class="nm" id="mName" aria-label="Map name" placeholder="Name this map" maxlength="60" autocomplete="off" spellcheck="false">
        <input class="cl" id="mClinic" aria-label="Clinic code" placeholder="Clinic" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
      <div class="status" id="status" role="status"><i></i><span></span></div>
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tabDraw" data-tab="draw" aria-selected="true">Draw</button>
      <button type="button" role="tab" id="tabPv" data-tab="preview" aria-selected="false" tabindex="-1">Preview<span class="cnt" id="pvCnt" hidden></span></button>
    </div>
    <div class="sp"></div>
    <button type="button" class="ib" id="bUndo" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
    <button type="button" class="ib" id="bRedo" aria-label="Redo" title="Redo (Ctrl+Y)"></button>
    <span class="vsep"></span>
    <button type="button" class="btn ghost mute" id="bFile" aria-haspopup="menu" aria-expanded="false">File</button>
    <button type="button" class="ib" id="bHelp" aria-label="Shortcuts and help" title="Shortcuts and help (?)"></button>
    <button type="button" class="btn ghost mute" id="bClose" hidden>Close</button>
    <button type="button" class="btn primary" id="bSave">Download file</button>
  </header>
  <div class="work" id="work">
    <nav class="rail" id="rail" aria-label="Tools"></nav>
    <section class="stage" id="stage" aria-label="Drawing">
      <svg id="cv" tabindex="0" role="application" aria-roledescription="drawing area" aria-label="Bay map drawing" aria-describedby="hint">
        <defs>
          <pattern id="gMin" patternUnits="userSpaceOnUse"><path class="gmin"/></pattern>
          <pattern id="gMaj" patternUnits="userSpaceOnUse"><path class="gmaj"/></pattern>
        </defs>
        <rect id="gMinR" width="100%" height="100%" fill="url(#gMin)"/>
        <rect id="gMajR" width="100%" height="100%" fill="url(#gMaj)"/>
        <g id="world"><g id="traceL"></g><g id="draw" class="bplan"></g><g id="hud"></g></g>
      </svg>
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="empty" id="empty" hidden>
        <div>
          <h2>Draw your clinic’s treatment rooms</h2>
          <p>Start with Room: drag a box for each room. Then add the doors and place the bays.</p>
          <div class="row"><button type="button" class="btn primary" data-act="toolRoom">Draw a room</button><button type="button" class="btn" data-act="templates">Start from a template</button></div>
          <p class="small muted">Have a floor plan? <button type="button" class="linkbtn" data-act="toolTrace">Trace over a picture of it</button></p>
        </div>
      </div>
      <div class="coach" id="coach" role="dialog" aria-label="Getting started" hidden></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="ib" id="zOut" aria-label="Zoom out" title="Zoom out (−)"></button>
        <output id="zPct" aria-live="off">100%</output>

const icon = (n, c = '') => `<svg class="ic${c ? ' ' + c : ''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

// ---------- tools ----------
const TOOLS = [

// Tool buttons with their shortcut, built once.
function buildRail(){
  $('#rail').innerHTML = TOOLS.map(t => t === '-' ? '<hr>' : `<button type="button" class="tool" data-tool="${t.id}" aria-pressed="false"${t.key.length === 1 ? ` aria-keyshortcuts="${t.key}"` : ` title="Or hold ${t.key} with any tool"`}>${icon(t.id)}<span>${esc(t.name)}</span>${t.key.length === 1 ? `<kbd>${t.key}</kbd>` : ''}</button>`).join('');
}
// Switch tool. A wall or curtain in progress is finished first, so nothing drawn is lost.
function setTool(id){

}

// ---------- model changes ----------
const sel1 = () => S.sel.length === 1 ? BM.byId(S.m, S.sel[0]) : null;

// Something changed but isn't finished (a drag, typing): redraw only.
function touch(){ S.ver++; paint(); }
// A finished change: one undo step, autosave, recheck, redraw.
function commit(){

}
// Replace the whole model (undo, template, file). reset = a fresh start with no undo history.
function setModel(m, reset = false){
  S.m = m; S.ver++; S.draw = null; S.drag = null; S.vsel = null; S.ghost = null;
  S.sel = S.sel.filter(id => BM.byId(m, id));

function afterHist(){ S.ver++; S.draw = null; S.vsel = null; const keep = S.sel.filter(id => BM.byId(S.m, id)); S.sel = keep.length ? keep : (S.lastSel || []).filter(id => BM.byId(S.m, id)); autosave(); scheduleCheck(); updUndo(); syncTop(); renderInsp(); paint(); }
function updUndo(){ $('#bUndo').disabled = !S.hist.canUndo(); $('#bRedo').disabled = !S.hist.canRedo(); }
function syncTop(){
  const n = $('#mName'), c = $('#mClinic');
  if (document.activeElement !== n) n.value = S.m.name || '';
  if (document.activeElement !== c) c.value = S.m.clinic || '';
}

// ---------- autosave ----------
// The draft lives in this browser only (bmDraft), so closing the page loses nothing.
function autosave(){
  clearTimeout(S.asT); S.saved = 'pend'; updStatus();
  S.asT = setTimeout(() => { S.saved = store.set(LS.draft, { v: 1, at: new Date().toISOString(), model: S.m }) ? 'ok' : 'fail'; updStatus(); }, 400);
}
function updStatus(){
  const el = $('#status'), t = $('#status span');
  el.className = 'status' + (S.saved === 'fail' ? ' fail' : S.dirty ? ' dirty' : '');
  t.textContent = S.saved === 'fail' ? 'Couldn’t save on this computer. Download the file to keep it.'
    : S.saving ? 'Saving to the tracker…' : S.dirty ? 'Not in the tracker yet' : S.host ? (S.hostBuiltIn ? 'The tracker has its built-in map' : 'Saved in the tracker') : 'Saved on this computer';
  el.title = S.saved === 'fail' ? '' : S.host ? 'Your work is also kept on this computer until you save it to the tracker.' : 'Kept in this browser. Download the file to use it in the tracker.';
}

// ---------- checks ----------
function scheduleCheck(){ clearTimeout(S.ckT); S.ckT = setTimeout(runCheck, 160); }
// The checklist: core.check() plus, when the tracker opened us, bays that today's visits use but this map lacks.
function runCheck(){
  let L;
  try { L = BM.check(S.m); } catch (e){ console.error(e); L = [{ level: 'error', msg: 'Something on the map can’t be checked. Undo the last change, or delete what you just added.', ids: [] }]; }
  if (S.hostBays.length && S.m.items.some(i => i.k === 'bay')){
    const have = new Set(S.m.items.filter(i => i.k === 'bay').map(b => String(b.no ?? '').trim().toLowerCase()));
    const miss = S.hostBays.filter(b => !have.has(String(b).toLowerCase()));
    if (miss.length) L.push({ level: 'warn', msg: `Today’s visits use ${miss.length > 1 ? 'bays' : 'Bay'} ${miss.join(', ')}, which ${miss.length > 1 ? 'aren’t' : 'isn’t'} on this map. Those visits show under the map until their bay is changed.`, ids: [] });
  }
  S.issues = S.m.items.length ? L : [];
  L = S.issues;

  const bad = L.filter(x => x.level === 'error').length, warn = L.filter(x => x.level === 'warn').length, c = $('#pvCnt');
  c.hidden = !(bad || warn); c.textContent = bad || warn; c.className = 'cnt' + (bad ? ' bad' : '');

// ---------- view ----------
const cv = $('#cv'), stage = $('#stage'), insp = $('#insp');
function toWorld(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - S.view.x) / S.view.k, (e.clientY - r.top - S.view.y) / S.view.k]; }
function zoomAt(f, sx, sy){
  const v = S.view, k = clamp(v.k * f, 0.08, 8), q = k / v.k;
  S.view = { k, x: sx - (sx - v.x) * q, y: sy - (sy - v.y) * q }; updZoom(); paint();
}
function zoomBy(f){ const r = cv.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
function updZoom(){ $('#zPct').textContent = Math.round(S.view.k * 100) + '%'; }
// What's drawn (and the trace picture), in drawing units.
function contentBox(){
  let b = null;
  if (S.m.items.length){ const L = BM.layout(S.m).box; b = { x0: L.x, y0: L.y, x1: L.x + L.w, y1: L.y + L.h }; }
  const T = S.trace; if (T){ const t = { x0: T.x, y0: T.y, x1: T.x + T.w, y1: T.y + T.h }; b = b ? { x0: Math.min(b.x0, t.x0), y0: Math.min(b.y0, t.y0), x1: Math.max(b.x1, t.x1), y1: Math.max(b.y1, t.y1) } : t; }
  return b;
}
// Fit a box (default: everything) in the view, never zooming in past 200%.
function fit(b = contentBox(), max = 2){
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  if (!b){ S.view = { k: 1, x: 40, y: 40 }; updZoom(); paint(); return; }
  const w = Math.max(b.x1 - b.x0, 40), h = Math.max(b.y1 - b.y0, 40), pad = 36;
  const k = clamp(Math.min((r.width - 2 * pad) / w, (r.height - 2 * pad - 30) / h), 0.08, max);
  S.view = { k, x: r.width / 2 - (b.x0 + w / 2) * k, y: r.height / 2 + 15 - (b.y0 + h / 2) * k }; updZoom(); paint();
}
// Bring items into view (from the checklist) without changing the zoom unless they don't fit.
function reveal(ids){
  let b = null; const L = BM.layout(S.m);
  for (const id of ids){ const it = BM.byId(S.m, id); if (!it) continue; const x = BM.itemBox(S.m, it, L);
    b = b ? { x0: Math.min(b.x0, x.x0), y0: Math.min(b.y0, x.y0), x1: Math.max(b.x1, x.x1), y1: Math.max(b.y1, x.y1) } : { ...x }; }
  if (!b) return;
  const r = cv.getBoundingClientRect(), k = S.view.k, s = [b.x0 * k + S.view.x, b.y0 * k + S.view.y, b.x1 * k + S.view.x, b.y1 * k + S.view.y];
  if (s[0] > 40 && s[1] > 60 && s[2] < r.width - 40 && s[3] < r.height - 60) return;
  if ((b.x1 - b.x0) * k > r.width - 120 || (b.y1 - b.y0) * k > r.height - 160) return fit(b, k);
  S.view = { k, x: r.width / 2 - (b.x0 + b.x1) / 2 * k, y: r.height / 2 - (b.y0 + b.y1) / 2 * k }; paint();
}
const center = () => { const r = cv.getBoundingClientRect(); return [(r.width / 2 - S.view.x) / S.view.k, (r.height / 2 - S.view.y) / S.view.k]; };

// ---------- drawing ----------
let raf = 0;
const paint = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawAll(); }); };
function drawAll(){
  const { k, x, y } = S.view;
  $('#world').setAttribute('transform', `translate(${x} ${y}) scale(${k})`);
  drawGrid();
  if (S.drawn !== S.ver){ S.drawn = S.ver; try { drawModel(); } catch (e){ console.error(e); } }
  if (S.traced !== S.traceVer){ S.traced = S.traceVer; drawTrace(); }
  try { $('#hud').innerHTML = hudHTML(); } catch (e){ console.error(e); }
  $('#empty').hidden = !!(S.m.items.length || S.trace || S.draw || S.drag || S.tool === 'trace');
}
// Grid: minor lines every grid step (6 in), major every 4 ft; drawn in screen pixels so lines stay crisp at any zoom.
function drawGrid(){
  const { k, x, y } = S.view, g = (S.m.grid || BM.GRID) * k, G = BM.UNIT * 4 * k;
  for (const [id, s] of [['gMin', g], ['gMaj', G]]){
    const p = $('#' + id); p.setAttribute('width', s); p.setAttribute('height', s); p.setAttribute('patternTransform', `translate(${x} ${y})`);
    p.firstElementChild.setAttribute('d', `M${s} .5H.5V${s}`);
  }

  $('#gMajR').style.display = S.prefs.grid && G >= 10 ? '' : 'none';
}
// The map itself, drawn by the tracker's renderer from the plan, with rugs, room names and tags added in SVG.
function drawModel(){
  const L = BM.layout(S.m), P = BM.planOf(S.m, L), [tw, th] = L.tag, bays = S.m.items.filter(i => i.k === 'bay');
  const rugs = bays.map(b => `<circle class="rug" cx="${b.x}" cy="${b.y}" r="${b.r}"/>`).join('');
  const rooms = S.m.items.filter(i => i.k === 'label' && String(i.t || '').trim()).map(l => `<text class="rlab${l.small ? ' small' : ''}" x="${l.x}" y="${l.y}">${esc(String(l.t).trim())}</text>`).join('');
  const tags = bays.map(b => { const t = L.bays.get(b.id)?.tag; if (!t) return '';
    const no = String(b.no ?? '').trim() || '?', px = -tw / 2 + th * 0.3;
    return `<g class="etag" transform="translate(${t[0]} ${t[1]})"><rect x="${-tw / 2}" y="${-th / 2}" width="${tw}" height="${th}" rx="${th * 0.24}"/><text x="${px}" y="${-th * 0.13}" font-size="${th * 0.3}" dominant-baseline="central">${esc(no)}<tspan dx="${th * 0.15}" font-weight="500">Open</tspan></text><text class="s" x="${px}" y="${th * 0.22}" font-size="${th * 0.24}" dominant-baseline="central">Nobody booked</text></g>`; }).join('');

function drawTrace(){
  const T = S.trace;
  $('#traceL').innerHTML = T ? `<image href="${T.src}" x="${T.x}" y="${T.y}" width="${T.w}" height="${T.h}" preserveAspectRatio="none" opacity="${T.op}"/>` : '';
}
const ptsD = pts => pts.length ? 'M' + pts.map(p => `${rnd(p[0])} ${rnd(p[1])}`).join('L') : '';
// Outline of one item for hover and selection.
function olHTML(it, cls){
  const m = S.m, u = 1 / S.view.k, pad = 3 * u;
  if (it.k === 'wall' || it.k === 'curtain') return `<path class="ol ${cls}" d="${ptsD(BM.polyOf(it))}"/>`;

// ---------- ESK Tracker link ----------
// Same chunking as ESK (sendChunks/makeRx), so long plans fit through Office's message size limit.
const CH = 12000;
function sendChunks(fn, obj){ const s = JSON.stringify(obj); const id = Math.random().toString(36).slice(2); const n = Math.max(1, Math.ceil(s.length / CH)); for (let i = 0; i < n; i++) fn(JSON.stringify({ c: id, i, n, d: s.slice(i * CH, (i + 1) * CH) })); }
function makeRx(handler){ const buf = {}; return str => { let m; try { m = JSON.parse(str); } catch { return; } if (!m || !m.c) return; const b = buf[m.c] || (buf[m.c] = []); b[m.i] = m.d; if (b.filter(x => x != null).length === m.n){ delete buf[m.c]; try { handler(JSON.parse(b.join(''))); } catch (e){ console.error(e); } } }; }
function hostSend(obj){
  try {
    if (S.host === 'office') sendChunks(s => Office.context.ui.messageParent(s), obj);
    else if (S.host === 'frame') window.parent.postMessage(obj, location.origin);
  } catch (e){ console.error(e); }
}
// Opened with ?from=esk: as an in-page frame from the tracker (same site), or as an Office dialog. Anything else is standalone.
function connectHost(){
  if (!FROM_ESK) return;
  let same = false; try { same = window.parent !== window && window.parent.location.origin === location.origin; } catch {}
  if (same){
    S.host = 'frame';
    window.addEventListener('message', e => { if (e.source === window.parent && e.origin === location.origin) onHost(e.data); });
    return hostReady();
  }
  // office.js is loaded here, not in <head>: inside the tracker page's frame it would navigate the frame away, and on its own
  // the page doesn't need it. If it can't load (offline), the page simply works on its own.
  const js = document.createElement('script');
  js.src = 'https://appsforoffice.microsoft.com/lib/1/hosted/office.js';
  js.onload = () => { if (!window.Office || !Office.onReady) return;
    Office.onReady(() => {
      if (!Office.context || !Office.context.ui || typeof Office.context.ui.messageParent !== 'function') return;
      S.host = 'office'; const rx = makeRx(onHost);
      try { Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => rx(a.message), () => hostReady()); } catch { hostReady(); }
    }); };
  document.head.appendChild(js);
}
function hostReady(){
  $('#bClose').hidden = false; $('#bSave').textContent = 'Save to tracker'; updStatus(); renderInsp();
  busy('Opening the map from ESK Tracker…');
  S.loadT = setTimeout(() => { busy(''); if (!S.loaded){ S.host = null; $('#bClose').hidden = true; $('#bSave').textContent = 'Download file'; updStatus(); renderInsp(); toast('warn', 'ESK Tracker didn’t answer, so you’re working on this computer only. Download the file when you’re done.', 8000); } }, 8000);
  hostSend({ ev: 'bmReady' });
}
function onHost(m){
  if (!m || typeof m !== 'object') return;
  if (m.ev === 'bmLoad') return hostLoad(m);
  if (m.ev === 'bmSaved') return hostSaved(m);
}

function hostLoad(msg){

  $('#zIn').addEventListener('click', () => zoomBy(1.25)); $('#zOut').addEventListener('click', () => zoomBy(0.8)); $('#zFit').addEventListener('click', () => fit());
  for (const [id, f] of [['#mName', 'name'], ['#mClinic', 'clinic']]){ const el = $(id);
    el.addEventListener('input', () => setF(f, el.value, false)); el.addEventListener('change', () => setF(f, el.value, true)); }
  $$('.tabs [role=tab]').forEach(b => { b.addEventListener('click', () => setTab(b.dataset.tab));
    b.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); const t = S.tab === 'draw' ? 'preview' : 'draw'; setTab(t); $(t === 'draw' ? '#tabDraw' : '#tabPv').focus(); } }); });
  $('#fileIn').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
  $('#imgIn').addEventListener('change', e => { openImage(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('resize', () => { paint(); if (S.tab === 'preview') fitPreview(); });
  window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.tab === 'preview') renderPreview(); });
  const d = store.get(LS.draft), m = d && BM.cleanModel(d.model), T = store.get(LS.trace);
  if (T && typeof T.src === 'string' && /^data:image\//.test(T.src) && [T.x, T.y, T.w, T.h, T.iw, T.ih].every(Number.isFinite)) S.trace = { ...T, op: clamp(+T.op || 0.5, 0.1, 1) };
  setModel(m || BM.newModel('New bay map'), true);
  setTool('select'); S.saved = 'ok'; updStatus();
  requestAnimationFrame(() => { if (S.m.items.length || S.trace) fit(); else { S.view = { k: 1, x: 40, y: 40 }; updZoom(); paint(); } });
  if (!store.get(LS.coach)) startCoach();
  connectHost();
}
boot();
</script>
</body>
